<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador Leyes de Newton</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <h1>⚡ Simulador de Newton</h1>

  <!-- ENUNCIADO -->
  <div class="enunciado">
    <h2>📘 Problema</h2>
    <p>
      Un bloque de masa <b>m</b> se mueve sobre una superficie horizontal sin fricción.
      Se le aplica una fuerza constante <b>F</b> durante un tiempo <b>t</b>.
    </p>

    <h3>❓ Preguntas</h3>
    <ul>
      <li>¿Cuál es la aceleración del objeto?</li>
      <li>¿Qué velocidad alcanza después del tiempo t?</li>
      <li>¿Qué distancia recorre?</li>
    </ul>
  </div>

  <!-- CONTROLES -->
  <div class="panel">

    <div class="control">
      <label>Fuerza (N): <span id="fuerzaVal">20</span></label>
      <input type="range" id="fuerza" min="1" max="100" value="20">
    </div>

    <div class="control">
      <label>Masa (kg): <span id="masaVal">5</span></label>
      <input type="range" id="masa" min="1" max="20" value="5">
    </div>

    <div class="control">
      <label>Tiempo (s): <span id="tiempoVal">5</span></label>
      <input type="range" id="tiempo" min="1" max="10" value="5">
    </div>

    <button onclick="calcular()">Resolver</button>

  </div>

  <!-- RESULTADOS -->
  <div class="resultados" id="resultado"></div>

  <!-- ANIMACIÓN -->
  <div class="escenario">
    <div id="objeto"></div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
